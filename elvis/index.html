<!DOCTYPE html>
<html lang="pt-BR" data-cav-base="../" data-cav-banner="top">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andrômeda · Atendimento CAV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --grafite:#1c1c1c; --grafite2:#2b2b2b; --cinza:#8a8a8a; --cinza-claro:#d9d9d9;
    --fundo:#ecebe8; --branco:#ffffff; --texto:#1f1f1f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Montserrat',system-ui,sans-serif;background:#111;color:var(--texto);
    display:flex;justify-content:center}
  .app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;background:var(--fundo);
    background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1px);background-size:18px 18px;position:relative}
  header{background:var(--grafite);color:var(--branco);display:flex;align-items:center;gap:14px;
    padding:calc(14px + env(safe-area-inset-top)) 18px 14px;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:2}
  .avatar{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a3a,#141414);
    border:1.5px solid #6f6f6f;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
  .avatar img{width:78%;height:auto}
  .who h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:25px;letter-spacing:.3px;line-height:1.05}
  .who p{font-size:12.5px;color:#bdbdbd;margin-top:3px;display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#e6e6e6;box-shadow:0 0 0 0 rgba(230,230,230,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,230,230,.5)}70%{box-shadow:0 0 0 7px rgba(230,230,230,0)}100%{box-shadow:0 0 0 0 rgba(230,230,230,0)}}
  .brand{margin-left:auto;text-align:right;font-family:'Cormorant Garamond',serif;font-size:12px;color:#a9a9a9;line-height:1.15;letter-spacing:.5px}
  #chat{flex:1;overflow-y:auto;padding:18px 14px 10px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
  .day{align-self:center;background:rgba(255,255,255,.85);color:#6b6b6b;font-size:12px;padding:5px 12px;border-radius:8px;margin-bottom:6px}
  .row{display:flex;align-items:flex-end;gap:8px}
  .row.user{justify-content:flex-end}
  .mini{width:30px;height:30px;border-radius:50%;background:#1c1c1c;display:flex;align-items:center;justify-content:center;flex-shrink:0;visibility:hidden}
  .mini img{width:76%}
  .row.last .mini{visibility:visible}
  .bubble{max-width:82%;padding:10px 13px 18px;border-radius:14px;font-size:15px;line-height:1.45;position:relative;
    box-shadow:0 1px 1.5px rgba(0,0,0,.12);animation:pop .22s ease-out;white-space:pre-wrap;word-wrap:break-word}
  .bot .bubble{background:var(--branco);border-top-left-radius:4px}
  .user .bubble{background:var(--grafite2);color:var(--branco);border-top-right-radius:4px}
  .bubble b{font-weight:600}
  .time{position:absolute;right:10px;bottom:4px;font-size:10.5px;color:#9a9a9a}
  .user .time{color:#a9a9a9}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .typing{display:inline-flex;gap:4px;padding:13px 15px}
  .typing span{width:7px;height:7px;border-radius:50%;background:#9a9a9a;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .options{display:flex;flex-direction:column;gap:7px;padding:4px 0 6px 38px;animation:pop .25s ease-out}
  .opt{background:var(--branco);border:1.5px solid var(--grafite2);color:var(--grafite);font:500 14.5px 'Montserrat',sans-serif;
    padding:11px 14px;border-radius:12px;text-align:left;cursor:pointer;transition:.15s}
  .opt:hover,.opt:focus-visible{background:var(--grafite2);color:var(--branco);outline:none}
  .opt.urgent{border-color:#000;background:#000;color:#fff}
  .cta{display:block;text-align:center;text-decoration:none;background:var(--grafite);color:#fff;font:600 15px 'Montserrat',sans-serif;
    padding:14px 16px;border-radius:12px;margin-top:2px;letter-spacing:.3px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
  .cta.alt{background:var(--branco);color:var(--grafite);border:1.5px solid var(--grafite2);box-shadow:none;font-weight:500}
  .note{font-size:11.5px;color:#777;text-align:center;padding:2px 20px 4px;line-height:1.4}
  footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:transparent;display:flex;gap:8px;align-items:center}
  footer.hidden{display:none}
  #input{flex:1;border:none;border-radius:24px;padding:14px 18px;font:400 15.5px 'Montserrat',sans-serif;background:var(--branco);
    box-shadow:0 1px 3px rgba(0,0,0,.12);outline:none;color:var(--texto)}
  #send{width:50px;height:50px;border-radius:50%;border:none;background:var(--grafite);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  #send svg{width:22px;height:22px;fill:#fff}
  #skip{border:none;background:transparent;font:500 13px 'Montserrat';color:#555;padding:8px;cursor:pointer;display:none}
  .restart{align-self:center;background:none;border:none;color:#666;font:500 12.5px 'Montserrat';text-decoration:underline;cursor:pointer;margin:6px 0 10px}
</style>
</head>

    `<div class="bubble">${html}<span class="time">${now()}</span></div>`;
  chat.appendChild(row); scroll(); return row;
}

async function bot(html, wait){
  const t = document.createElement('div');
  t.className = 'row bot';
  t.innerHTML = `<div class="mini" style="visibility:visible"><img src="${AVATAR}" alt=""></div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  chat.querySelectorAll('.row.bot.last').forEach(r => r.classList.remove('last'));
  chat.appendChild(t); scroll();
  await sleep(wait ?? Math.min(1500, 500 + html.length * 12));
  t.remove(); addRow('bot', html);
}

function user(text){ addRow('user', esc(text)); }

function choose(options){
  return new Promise(resolve => {
    const box = document.createElement('div'); box.className = 'options';
    options.forEach(o => {
      const label = typeof o === 'string' ? o : o.label;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'opt' + (o.urgent ? ' urgent' : ''); b.textContent = label;
      b.onclick = () => { box.remove(); user(label); resolve(typeof o === 'string' ? o : (o.value ?? o.label)); };
      box.appendChild(b);
    });
    chat.appendChild(box); scroll();
  });
}

function ask(placeholder, optional){
  return new Promise(resolve => {
    bar.classList.remove('hidden'); input.value = ''; input.placeholder = placeholder || 'Digite aqui';
    skipBtn.style.display = optional ? 'block' : 'none';
    setTimeout(() => input.focus(), 50);
    const done = (val) => { cleanup(); bar.classList.add('hidden'); resolve(val); };
    const submit = () => { const v = input.value.trim(); if (!v) { input.focus(); return; } user(v); done(v); };
    const onKey = e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
    const onSkip = () => { user('Prefiro pular'); done(''); };
    function cleanup(){ sendBtn.removeEventListener('click', submit); input.removeEventListener('keydown', onKey); skipBtn.removeEventListener('click', onSkip); }
    sendBtn.addEventListener('click', submit); input.addEventListener('keydown', onKey); skipBtn.addEventListener('click', onSkip);
  });
}

const CIDADE = { key:'cidade', type:'text', q:'Em qual <b>cidade</b> você está (ou onde o caso acontece)?', ph:'Ex.: Naviraí/MS' };

    { key:'cidade', type:'text', q: a => a.urgente ? 'Situações de prisão são tratadas com <b>prioridade</b> pelo nosso plantão.\n\nEm qual <b>cidade</b> a pessoa foi presa ou está detida?' : CIDADE.q, ph:'Ex.: Naviraí/MS' },
    { key:'vinculo', type:'options', q:'Você é a própria pessoa envolvida ou um familiar/amigo?', options:['Sou a própria pessoa','Sou familiar ou amigo(a)'] },

    { key:'processo', type:'options', q:'Já existe algum processo sobre isso?', options:['Sim','Não','Não sei'] },
    CIDADE,

    { key:'vinculo', type:'options', q:'Qual a sua situação com a empresa hoje?', options:['Ainda trabalho lá','Saí há menos de dois anos','Saí há mais de dois anos','Sou o empregador'] },
    CIDADE,
  ],
  'Previdenciário (INSS)': [

    { key:'inss', type:'options', q:'Você já fez o pedido no INSS?', options:['Ainda não','Sim, está em análise','Sim, foi negado'] },
    CIDADE,
  ],
  'Cível, Consumidor e Saúde': [

const LABELS = { esfera:'Esfera', situacao:'Situação', processo:'Já existe processo', vinculo:'Vínculo', inss:'Pedido no INSS', urgencia:'Urgência', porte:'Porte', advogado:'Advogado', cidade:'Cidade', relato:'Relato' };

function whatsappLink(){
  const L = [];
  if (A.urgente) L.push('🚨 *PLANTÃO CRIMINAL*');
  L.push(`Olá! Vim pelo atendimento da ${CFG.nome}.`);
  L.push(`*Origem:* ${CFG.origem}`);
  L.push('');
  L.push(`*Nome:* ${A.nome}`);
  L.push(`*Área:* ${A.area}`);
  ['situacao','esfera','vinculo','processo','inss','urgencia','porte','advogado','cidade','relato'].forEach(k => { if (A[k]) L.push(`*${LABELS[k]}:* ${A[k]}`); });
  return `https://wa.me/${A.urgente ? PLANTAO : CFG.whatsapp}?text=${encodeURIComponent(L.join('\n'))}`;
}

async function run(){
  Object.keys(A).forEach(k => delete A[k]);
  await bot(CFG.intro, 900);
  await bot('Sou um atendimento automatizado: vou fazer algumas perguntas rápidas para encaminhar seu caso ao advogado certo. Leva menos de um minuto.');
  await bot('Antes de tudo, como posso chamar você?', 700);
  A.nome = await ask('Digite seu nome');

  await bot(`Prazer, <b>${esc(first())}</b>! Em qual destas áreas você precisa de ajuda?`);
  A.area = await choose(Object.keys(FLOWS).map(k => k === 'Criminal / Plantão 24h' ? {label:'⚖️ Criminal / Plantão 24h', value:k} : k));

  if (CFG.advogado) A.advogado = CFG.advogado;
  for (const step of FLOWS[A.area]){
    if (step.key === 'advogado' && CFG.advogado) continue;
    const q = typeof step.q === 'function' ? step.q(A) : step.q;
    await bot(q);
    if (step.type === 'options') A[step.key] = await choose(step.options);
    else A[step.key] = await ask(step.ph);
    if (step.key === 'situacao' && A.situacao === 'Prisão em flagrante (agora)') A.urgente = true;
  }

  if (!A.urgente){
    await bot('Se quiser, descreva <b>em poucas palavras</b> o que aconteceu. Não é obrigatório — os detalhes você poderá passar diretamente ao advogado.');
    A.relato = await ask('Escreva aqui (opcional)', true);
  }

  if (A.urgente){
    await bot(`Obrigada, <b>${esc(first())}</b>. Toque no botão abaixo para falar <b>agora</b> com o advogado de plantão pelo WhatsApp. A mensagem já vai com o seu resumo preenchido.`);
  } else {
    await bot(`Pronto, <b>${esc(first())}</b>! Toque no botão abaixo para enviar seu resumo pelo WhatsApp. ${CFG.final}`);
  }
  const box = document.createElement('div'); box.className = 'options';
  box.innerHTML = `<a class="cta" href="${whatsappLink()}" target="_blank" rel="noopener">${A.urgente ? '🚨 Falar com o plantão agora' : 'Enviar pelo WhatsApp'}</a>`;
  box.querySelector('.cta').addEventListener('click', () => window.cavTrack && window.cavTrack('generate_lead', { area: A.area, assistente: CFG.nome, plantao: A.urgente ? 'sim' : 'nao' }));
  chat.appendChild(box);
  const note = document.createElement('div'); note.className = 'note';
  note.innerHTML = (A.urgente ? 'Plantão: (67) 97400-8906' : 'WhatsApp: ' + CFG.fone) + ' · Rua Faustina Andrade da Silva, 334, Sala C, Naviraí/MS<br>Atendimento automatizado de triagem. Não constitui consulta jurídica. Suas informações são usadas apenas para o seu atendimento.';
  chat.appendChild(note);
  const r = document.createElement('button'); r.className = 'restart'; r.type = 'button'; r.textContent = 'Recomeçar atendimento';
  r.onclick = () => { chat.innerHTML = '<div class="day">Hoje</div>'; run(); };
  chat.appendChild(r); scroll();
}

run();
</script>
